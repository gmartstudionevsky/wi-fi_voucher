services:
  - type: web
    name: artstudio-wifi-vouchers
    runtime: docker
    plan: free
    region: frankfurt
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: HOTEL_ID
        value: artstudio-nevsky
      - key: HOTEL_NAME
        value: ARTSTUDIO NEVSKY
      - key: RESERVATION_TTL_MINUTES
        value: "15"
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
