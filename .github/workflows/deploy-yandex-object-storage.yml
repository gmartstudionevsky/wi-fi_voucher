name: Deploy to Yandex Object Storage

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: yandex-object-storage-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        run: pnpm run build

      - name: Verify browser PDF generator
        run: node scripts/verify_client_pdf.mjs

      - name: Install AWS CLI
        run: python -m pip install --disable-pip-version-check --quiet awscli

      - name: Deploy static files to Yandex Object Storage
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.YC_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.YC_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ru-central1
          AWS_EC2_METADATA_DISABLED: "true"
          YC_BUCKET: ${{ secrets.YC_BUCKET }}
        run: |
          set -euo pipefail
          test -n "$YC_BUCKET"
          aws s3 sync dist/ "s3://$YC_BUCKET/" \
            --endpoint-url=https://storage.yandexcloud.net \
            --delete \
            --only-show-errors

          # index.html must be revalidated so users receive new hashed assets
          # immediately after a deployment rather than a stale app shell.
          aws s3 cp dist/index.html "s3://$YC_BUCKET/index.html" \
            --endpoint-url=https://storage.yandexcloud.net \
            --cache-control="no-cache, no-store, must-revalidate" \
            --content-type="text/html; charset=utf-8" \
            --only-show-errors

      - name: Verify uploaded index
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.YC_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.YC_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ru-central1
          AWS_EC2_METADATA_DISABLED: "true"
          YC_BUCKET: ${{ secrets.YC_BUCKET }}
        run: |
          aws s3api head-object \
            --bucket "$YC_BUCKET" \
            --key index.html \
            --endpoint-url=https://storage.yandexcloud.net \
            >/dev/null
          echo "Yandex Object Storage deployment verified."
